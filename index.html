<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List Application</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
</head>

<body>
        <!-- ================= HEADER ================= -->

     <div class="search-bar">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input 
            type="text" 
            id="searchInput"
            placeholder="Search for a task..."
            autocomplete="off"
        >



            <div class="header-icons">

                <button class="icon-btn">
                    <i class="fa-solid fa-bell"></i>
                    <span class="notification-dot"></span>
                </button>

                <button class="icon-btn">
                    <i class="fas fa-user"></i>
                </button>

            </div>

        </div>


        <!-- ================= MAIN CONTENT ================= -->

        <div class="main-content">

            <!-- Title -->

            <div class="title-section">

                <div class="greeting" id="greeting">
                    Good Morning
                </div>

                <h1>

                    You've got

                    <span class="task-count" id="taskCount">
                        0
                    </span>

                    task today

                    <button class="add-btn" onclick="openModel()">
                        <i class="fas fa-plus"></i>
                        Add New
                    </button>

                </h1>

            </div>


            <!-- ================= ON HOLD ================= -->

            <div class="section">

                <div class="section-header">

                    <h2>
                        On Hold
                    </h2>

                </div>

                <div id="onHoldTasks"></div>

            </div>


            <!-- ================= COMPLETED ================= -->

            <div class="section">

                <div class="section-header">

                    <h2>
                        Completed
                    </h2>

                    <span class="badge badge-inactive">
                        Inactive
                    </span>

                </div>

                <div id="completedTasks"></div>

            </div>

        </div>


        <!-- ================= RIGHT SIDEBAR ================= -->

        <div class="sidebar">

            <div class="sidebar-section">

                <div class="sidebar-title">
                    Results Summary
                </div>


                <!-- Completion Rate -->

                <div class="stat-card">

                    <div class="stat-label">
                        Completion Rate
                    </div>

                    <div class="stat-value" id="completionRateValue">
                        0%
                    </div>

                    <div class="progress-bar">

                        <div class="progress-fill"
                             id="completionProgress">
                        </div>

                    </div>

                </div>


                <!-- Total Tasks -->

                <div class="stat-card">

                    <div class="stat-label">
                        Total Tasks
                    </div>

                    <div class="stat-value" id="totalTasks">
                        0
                    </div>

                    <div class="progress-bar">

                        <div class="progress-fill"
                             id="totalProgress">
                        </div>

                    </div>

                </div>


                <!-- Completed -->

                <div class="stat-card">

                    <div class="stat-label">
                        Completed
                    </div>

                    <div class="stat-value" id="completedCount">
                        0
                    </div>

                </div>


                <!-- Pending -->

                <div class="stat-card">

                    <div class="stat-label">
                        Pending
                    </div>

                    <div class="stat-value" id="pendingCount">
                        0
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ================= MODAL ================= -->

    <div class="model" id="taskModel">

        <div class="model-content">

            <h2 class="model-header">
                Add / Update Task
            </h2>


            <form id="taskForm" autocomplete="off">


                <!-- Task Title -->

                <div class="form-group">

                    <label for="TaskTitle">
                        Task Title
                    </label>

                    <input type="text"
                           id="taskTitle"
                           placeholder="Enter task title"
                           required>

                </div>


                <!-- Status -->

                <div class="form-group">

                    <label for="taskStatus">
                        Status
                    </label>

                    <select id="taskStatus">

                        <option value="pending">
                            Pending
                        </option>

                        <option value="progress">
                            In Progress
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                    </select>

                </div>


                <!-- Priority -->

                <div class="form-group">

                    <label for="taskPriority">
                        Priority
                    </label>

                    <select id="taskPriority">

                        <option value="minor">
                            Minor
                        </option>

                        <option value="normal">
                            Normal
                        </option>

                        <option value="critical">
                            Critical
                        </option>

                    </select>

                </div>


                <!-- Buttons -->

                <div class="model-actions">

                    <button type="button"
                            class="btn btn-secondary"
                            onclick="closeModal()">
                        Cancel
                    </button>

                    <button type="submit"
                            class="btn btn-primary">
                        Save Task
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
<p style="color:#9ca3af;padding:20px">No task on hold</p>
